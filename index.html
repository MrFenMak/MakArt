<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
:root{
  --orange:#F97316;
  --orange-dark:#EA580C;
  --bg:#F4F4F5;
  --bg2:#FFFFFF;
  --bg3:#E4E4E7;
  --text:#18181B;
  --text2:#71717A;
  --border:#D4D4D8;
  --card:#FFFFFF;
}
html.dark{
  --bg:#18181B;
  --bg2:#27272A;
  --bg3:#3F3F46;
  --text:#FAFAFA;
  --text2:#A1A1AA;
  --border:#52525B;
  --card:#1C1C1F;
}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .2s,color .2s}
input,textarea,select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;width:100%;font-size:14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:500;padding:10px 20px;transition:all .15s;font-family:inherit}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{background:var(--orange-dark)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange)}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* AUTH */
#auth-screen{align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--bg2);border-radius:16px;padding:32px;width:100%;max-width:380px;border:1px solid var(--border)}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo h1{font-size:28px;font-weight:700;color:var(--orange)}
.auth-tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg3);border-radius:8px;padding:4px}
.auth-tab{flex:1;padding:8px;border-radius:6px;background:transparent;color:var(--text2);border:none;cursor:pointer;font-size:14px}
.auth-tab.active{background:var(--orange);color:#fff}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.err{color:#F87171;font-size:13px;margin-top:8px;text-align:center;min-height:16px}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOP BAR with coins */
.top-bar-main{background:var(--orange);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-shrink:0}
.coins-display{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.18);border-radius:20px;padding:5px 12px;color:#fff;font-weight:600;font-size:13px;flex-shrink:0;white-space:nowrap}
.coin-icon{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE899,#F5C518 60%,#C9960B);display:inline-block;border:1px solid #A67A05;flex-shrink:0}
.cats-scroll{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;cursor:grab;min-width:0}
.cats-scroll::-webkit-scrollbar{display:none}
.cats-scroll.dragging{cursor:grabbing;scroll-behavior:auto}
.cat-btn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat-btn.active{background:#fff;color:var(--orange-dark)}
.cat-arrow{background:rgba(0,0,0,.18);border:none;color:#fff;padding:0;width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.theme-toggle{background:rgba(0,0,0,.18);border:none;padding:0;width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.theme-toggle svg{width:17px;height:17px;flex-shrink:0}

/* BOTTOM NAV */
.bottom-nav{background:var(--orange);display:flex;height:58px;flex-shrink:0;position:sticky;bottom:0;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.7);background:transparent;border:none;cursor:pointer;font-size:10px}
.nav-btn.active,.nav-btn:hover{color:#fff}
.nav-btn svg{width:22px;height:22px}

/* MAIN CONTENT */
.main-content{flex:1;overflow-y:auto;padding:12px}

/* GRID */
.pictures-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pic-card{background:var(--bg2);border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform .1s,border-color .1s}
.pic-card:hover{transform:translateY(-2px);border-color:var(--orange)}
.pic-thumb{width:100%;aspect-ratio:1;position:relative;background:var(--bg3);overflow:hidden}
.pic-thumb canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.pic-info{padding:8px}
.pic-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pic-meta{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;margin-top:3px}
.coin-badge{background:rgba(249,115,22,.15);color:var(--orange-dark);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
html.dark .coin-badge{color:#FDBA74}
.progress-bar{height:3px;background:var(--bg3);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--orange);transition:width .3s}
.lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#fff;font-size:12px}
.lock-overlay svg{width:26px;height:26px}
.pic-edit-pencil{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pic-drag-handle{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:grab}
.pic-delete-draft{position:absolute;bottom:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(248,113,113,.85);border:none;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

/* DRAWING SCREEN */
#draw-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
#draw-screen.open{display:flex}
.draw-top{background:var(--bg2);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.draw-title{font-weight:600;font-size:15px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none}
.viewport canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.adm-viewport{flex:1 1 320px;min-height:320px;border:1px solid var(--border);border-radius:8px}
.color-menu{background:var(--bg2);border-top:1px solid var(--border);padding:10px 12px;flex-shrink:0}
.color-row{display:flex;gap:6px;align-items:center;justify-content:flex-start;flex-wrap:wrap}
.color-item{position:relative;width:44px;height:44px;border-radius:8px;cursor:pointer;border:2px solid transparent;overflow:hidden;flex-shrink:0}
.color-item.selected{border-color:var(--text)}
.color-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;pointer-events:none}
.color-progress{position:absolute;bottom:0;left:0;height:4px;background:rgba(255,255,255,.85)}
.color-nav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px}
.nav-arr{background:var(--bg3);border:none;color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:16px}
.zoom-hint{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .3s}

/* PROFILE */
.profile-wrap{max-width:600px;margin:0 auto;padding:16px}
.profile-header{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.profile-info{flex:1;min-width:0}
.profile-nick{font-size:20px;font-weight:700}
.profile-login{font-size:12px;color:var(--text2)}
.profile-desc{font-size:14px;color:var(--text2);margin-top:6px;word-break:break-word}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat-box{background:var(--bg2);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border)}
.stat-num{font-size:22px;font-weight:700;color:var(--orange);display:flex;align-items:center;justify-content:center;gap:5px}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px}
.edit-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.edit-btn:hover{border-color:var(--orange)}
.section-title{font-size:15px;font-weight:600;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.completed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.completed-card{border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg2);border:1px solid var(--border)}
.completed-card canvas{width:100%;aspect-ratio:1;display:block;image-rendering:pixelated}

/* FRIENDS / SEARCH */
.search-bar-wrap{padding:12px}
.search-input-wrap{position:relative}
.search-input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text2);width:18px;height:18px}
.search-input-wrap input{padding-left:36px}
.user-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border-radius:10px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer}
.user-item:hover{border-color:var(--orange)}
.u-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg3);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;flex-shrink:0;color:var(--text)}
.u-name{font-weight:600;font-size:14px}
.u-sub{font-size:12px;color:var(--text2)}
.friend-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.badge{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.badge-green{background:rgba(74,222,128,.15);color:#22C55E}
.badge-orange{background:rgba(249,115,22,.15);color:var(--orange)}

/* TOP */
.top-tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--bg2);border-radius:8px;padding:4px;border:1px solid var(--border)}
.top-tab{flex:1;padding:8px;background:transparent;border:none;color:var(--text2);border-radius:6px;cursor:pointer;font-size:13px}
.top-tab.active{background:var(--orange);color:#fff}
.top-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
.top-rank{font-size:18px;font-weight:700;color:var(--orange);width:28px;text-align:center;flex-shrink:0}
.top-val{font-size:14px;font-weight:700;color:var(--orange);margin-left:auto;display:flex;align-items:center;gap:4px;flex-shrink:0}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--bg2);border-radius:16px;padding:24px;width:100%;max-width:420px;border:1px solid var(--border);max-height:88vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}

/* ADMIN */
.music-fab{position:fixed;bottom:70px;left:16px;width:48px;height:48px;border-radius:50%;background:var(--orange);border:none;color:#fff;padding:0;cursor:pointer;z-index:150;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(249,115,22,.4)}
.music-fab svg{flex-shrink:0}
.music-fab.playing{animation:mpulse 1.6s ease-in-out infinite}
@keyframes mpulse{0%,100%{box-shadow:0 4px 12px rgba(249,115,22,.4)}50%{box-shadow:0 0 0 8px rgba(249,115,22,.25)}}
.music-panel{position:fixed;left:16px;bottom:128px;width:min(340px,calc(100vw - 32px));max-height:min(520px,calc(100vh - 200px));background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:160;display:flex;flex-direction:column;overflow:hidden}
.mp-now{padding:14px 14px 10px;flex-shrink:0}
.mp-title{text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.mp-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px}
.mp-btn{background:transparent;border:none;color:var(--text);width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mp-btn:hover{background:var(--bg3)}
.mp-btn svg{flex-shrink:0}
.mp-seek{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.mp-seek span{min-width:34px;text-align:center;white-space:nowrap}
.mp-bar{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none}
.mp-bar::before{content:'';position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--text);opacity:.85}
.mp-fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--orange);width:0}
.mp-knob{position:absolute;top:4px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--orange)}
.mp-sep{height:1px;background:var(--border);flex-shrink:0}
.mp-listhead{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;font-size:12px;color:var(--text2);flex-shrink:0}
.mp-add{background:var(--orange);color:#fff;border:none;width:26px;height:26px;border-radius:50%;padding:0;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.mp-list{overflow-y:auto;padding:0 8px 8px;min-height:0}
.mp-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px}
.mp-row.active .mp-name{color:var(--orange);font-weight:600}
.mp-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.mp-dur{font-size:12px;color:var(--text2);flex-shrink:0}
.mp-rowbtn,.mp-del{background:transparent;border:none;color:var(--text);padding:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.mp-del{color:#F87171;font-size:13px}
.mp-rowbtn:hover,.mp-del:hover{background:var(--bg3)}
.mp-empty{padding:16px;text-align:center;font-size:13px;color:var(--text2)}
.admin-fab{position:fixed;bottom:70px;right:16px;width:48px;height:48px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:24px;cursor:pointer;z-index:150;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(249,115,22,.4)}

/* VIEW COMPLETED */
#view-completed-screen{position:fixed;inset:0;background:var(--bg);z-index:250;display:none;flex-direction:column}
#view-completed-screen.open{display:flex}

/* LOADING OVERLAY */
#loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading-overlay .spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}

/* UTILS */
.hidden{display:none!important}
.w100{width:100%}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="loading-overlay"><div class="spin"></div><div style="color:var(--text2);font-size:13px">Загрузка Mak Art...</div></div>

<!-- AUTH SCREEN -->

// ============================================================
// SUPABASE CONFIG — ВСТАВЬ СВОИ ДАННЫЕ СЮДА
// ============================================================
const SUPABASE_URL = 'https://ccfekmcnwfvwdimpisem.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_28o8HVrzdwdJVBzCF17LcQ_i78jG8QJ';

let sb = null;
let DEMO_MODE = false;

function initSupabase(){
  if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')){
    DEMO_MODE = true;
    console.warn('Mak Art: Supabase не настроен. Впиши свои данные в SUPABASE_URL / SUPABASE_ANON_KEY. Сейчас приложение работает в демо-режиме на localStorage.');

  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// LOCAL FALLBACK STORAGE (только для DEMO_MODE без supabase)
// ============================================================
const LS = {
  get(k){try{return JSON.parse(localStorage.getItem('makart_'+k))}catch{return null}},
  set(k,v){localStorage.setItem('makart_'+k,JSON.stringify(v))}
};

// ============================================================
// THEME
// ============================================================
function applyTheme(theme){
  document.documentElement.classList.toggle('dark',theme==='dark');
  const btn=document.getElementById('theme-toggle');
  btn.innerHTML = theme==='dark'
    ? `<svg viewBox="0 0 24 24" width="17" height="17"><path fill="#fff" d="M12 2.5a9.5 9.5 0 1 0 9.46 10.55.75.75 0 0 0-.9-.83 7.6 7.6 0 0 1-9.18-9.18.75.75 0 0 0-.83-.9c-.07.01-.13.02-.55.06A9.5 9.5 0 0 0 12 2.5z"/><circle cx="8.7" cy="9" r="1" fill="#fff" opacity="0.45"/><circle cx="11.3" cy="13.2" r="1.3" fill="#fff" opacity="0.45"/><circle cx="7.6" cy="14" r="0.8" fill="#fff" opacity="0.45"/></svg>`
    : `<svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="5" fill="#fff"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="4.2" x2="5.9" y2="5.9"/><line x1="18.1" y1="18.1" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="5.9" y2="18.1"/><line x1="18.1" y1="5.9" x2="19.8" y2="4.2"/></g></svg>`;
  localStorage.setItem('makart_theme',theme);
  window._themeStamp=(window._themeStamp||0)+1;
}
function toggleTheme(){
  const cur=document.documentElement.classList.contains('dark')?'dark':'light';
  applyTheme(cur==='dark'?'light':'dark');
}

    reward:d.reward,price:d.price,categories:(d.categories&&d.categories.length?d.categories:(d.category?[d.category]:['Все'])),

async function doLogin(){
  const login=document.getElementById('li-login').value.trim();
  const pass=document.getElementById('li-pass').value;
  const errEl=document.getElementById('li-err');
  const btn=document.getElementById('li-btn');
  errEl.textContent='';
  if(!login||!pass){errEl.textContent='Заполните все поля';return}
  btn.innerHTML='<span class="spinner"></span>';
  try{
    const u=await DB.getUser(login);
    if(!u||u.password!==pass){errEl.textContent='Неверный логин или пароль';btn.textContent='Войти';return}
    saveSession(login);
    await enterApp(u);
  }catch(e){console.error(e);errEl.textContent='Ошибка подключения к серверу';}
  btn.textContent='Войти';
}

async function doRegister(){
  const login=document.getElementById('re-login').value.trim();
  const pass=document.getElementById('re-pass').value;
  const err=document.getElementById('re-err');
  const btn=document.getElementById('re-btn');
  err.textContent='';
  if(login.length<2){err.textContent='Логин слишком короткий';return}
  if(pass.length<3){err.textContent='Пароль слишком короткий';return}
  if(!/^[a-zA-Zа-яА-Я0-9_]+$/.test(login)){err.textContent='Логин: только буквы, цифры, _';return}
  btn.innerHTML='<span class="spinner"></span>';
  try{
    const existing=await DB.getUser(login);
    if(existing){err.textContent='Логин уже занят';btn.textContent='Зарегистрироваться';return}
    const users=await DB.getUsers();
    if(users.find(u=>u.nick===login)){err.textContent='Этот ник уже занят';btn.textContent='Зарегистрироваться';return}
    const nu={login,password:pass,nick:login,desc:'',coins:0,totalCoins:0,avatar:null,isAdmin:login==='M_fen'};
    const created=await DB.createUser(nu);
    saveSession(login);
    await enterApp(created);
  }catch(e){console.error(e);err.textContent='Ошибка подключения к серверу';}
  btn.textContent='Зарегистрироваться';
}

let _channels=[],_rtHomeT=0;
function subscribeRealtime(){
  if(DEMO_MODE||!sb)return;
  unsubscribeRealtime();
  const ch=sb.channel('makart-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'pictures'},()=>{
      _picCache=null;
      clearTimeout(_rtHomeT);
      _rtHomeT=setTimeout(()=>{if(!isDrawOpen()&&getActiveNav()==='home')renderHome();},500);
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'categories'},()=>{renderCats();})
    .on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>{if(getActiveNav()==='top')renderTop();})
    .subscribe();
  _channels.push(ch);
}
function unsubscribeRealtime(){
  _channels.forEach(c=>sb&&sb.removeChannel(c));
  _channels=[];
}
function isDrawOpen(){return document.getElementById('draw-screen').classList.contains('open')}
function getActiveNav(){

let _sortMode='newest';
const SORT_LABELS={
  newest:'Сначала новые',
  oldest:'Сначала старые',
  freeFirst:'Сначала бесплатные',
  paidFirst:'Сначала платные',
  smallFirst:'Сначала маленькие',
  bigFirst:'Сначала большие'
};

function sortPictures(pics){
  const arr=[...pics];
  switch(_sortMode){
    case 'newest': return arr.sort((a,b)=>b.id-a.id);
    case 'oldest': return arr.sort((a,b)=>a.id-b.id);
    case 'freeFirst': return arr.sort((a,b)=>(a.price>0?1:0)-(b.price>0?1:0));
    case 'paidFirst': return arr.sort((a,b)=>(b.price>0?1:0)-(a.price>0?1:0));
    case 'smallFirst': return arr.sort((a,b)=>(a.cols*a.rows)-(b.cols*b.rows));
    case 'bigFirst': return arr.sort((a,b)=>(b.cols*b.rows)-(a.cols*a.rows));
    default: return arr;
  }
}

function openSortMenu(){
  const items=Object.entries(SORT_LABELS).map(([key,label])=>
    `<button class="btn-ghost w100" style="text-align:left;margin-bottom:6px;${key===_sortMode?'border-color:var(--orange);color:var(--orange)':''}" onclick="setSortMode('${key}')">${label}${key===_sortMode?' ✓':''}</button>`
  ).join('');
  showModal(`<div class="modal-title">Сортировка картин</div>${items}`);
}
function setSortMode(mode){
  _sortMode=mode;
  closeModal();
  renderPictures();
}

async function renderPictures(){
  const cu=await refreshCurrentUser();
  const home=document.getElementById('view-home');
  home.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">Загрузка...</div>';

  const [allPics,myProgress]=await Promise.all([DB.getPictures(),DB.getAllProgressForUser(cu.login)]);
  let pics=allPics.filter(p=>!p.draft);
  if(_activeCat!=='Все')pics=pics.filter(p=>(p.categories||['Все']).includes(_activeCat));

  const progressMap={};
  myProgress.forEach(p=>progressMap[p.pictureId]=p);

  pics=pics.filter(p=>{
    const pr=progressMap[p.id];
    return!(pr&&pr.full);
  });

  pics=sortPictures(pics);

  home.innerHTML='';

  const header=document.createElement('div');
  header.style.cssText='display:flex;justify-content:flex-end;margin-bottom:8px';
  header.innerHTML=`<button class="btn-ghost" style="padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:5px" onclick="openSortMenu()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h10M3 12h7M3 17h4"/><path d="M17 5v14M17 5l-3 3M17 5l3 3M17 19l-3-3M17 19l3-3"/></svg>${SORT_LABELS[_sortMode]}</button>`;
  home.appendChild(header);

  if(pics.length===0){
    const empty=document.createElement('div');
    empty.style.cssText='text-align:center;padding:60px 20px;color:var(--text2)';
    empty.innerHTML='Нет доступных картин 🎉';
    home.appendChild(empty);
  }else{
    const grid=document.createElement('div');
    grid.className='pictures-grid';
    pics.forEach(p=>{
      const progress=progressMap[p.id];
      const pct=progress?calcPercent(progress.pixels,p.pixels):0;
      const purchased=progress&&progress.purchased;
      const locked=p.price>0&&!purchased;
      const card=document.createElement('div');
      card.className='pic-card';
      card.innerHTML=`
        <div class="pic-thumb">
          <canvas id="thumb-${p.id}" width="${p.cols}" height="${p.rows}"></canvas>
          ${locked?`<div class="lock-overlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span style="display:flex;align-items:center;gap:4px"><span class="coin-icon"></span>${p.price}</span></div>`:''}
          ${cu.isAdmin?`<button class="pic-edit-pencil" onclick="event.stopPropagation();openAdminQuickEdit(${p.id})" title="Изменить">✏️</button>`:''}
          ${cu.isAdmin?`<div class="pic-drag-handle" draggable="true" title="Перетащить">⠿</div>`:''}
        </div>
        <div class="pic-info">
          <div class="pic-name">${escapeHtml(p.name)}</div>
          <div class="pic-meta"><span class="coin-badge"><span class="coin-icon"></span>+${p.reward}</span>${p.price?`<span style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:3px"><span class="coin-icon"></span>${p.price}</span>`:''}</div>
          ${pct>0?`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`:''}
        </div>`;
      card.dataset.picId=p.id;
      card.onclick=()=>openPicture(p,progress);
      grid.appendChild(card);
      setTimeout(()=>drawThumb(p,progress,`thumb-${p.id}`),0);
    });
    home.appendChild(grid);
    if(cu.isAdmin)setupDragReorder(grid,pics,renderHome);
  }

  if(cu.isAdmin){
    const drafts=allPics.filter(p=>p.draft);
    if(drafts.length){
      const dt=document.createElement('div');
      dt.innerHTML='<div class="section-title">Черновики (видны только вам)</div>';
      const dg=document.createElement('div');dg.className='pictures-grid';
      drafts.forEach(p=>{
        const dc=document.createElement('div');dc.className='pic-card';
        dc.style.opacity='0.65';dc.style.position='relative';
        dc.innerHTML=`<div class="pic-thumb"><canvas id="thumb-d${p.id}" width="${p.cols}" height="${p.rows}"></canvas><button class="pic-delete-draft" onclick="event.stopPropagation();deleteDraft(${p.id})" title="Удалить черновик">🗑</button></div><div class="pic-info"><div class="pic-name">📝 ${escapeHtml(p.name||'Без названия')}</div></div>`;
        dc.onclick=()=>openAdminEdit(p);
        dg.appendChild(dc);
        setTimeout(()=>drawThumb(p,null,`thumb-d${p.id}`),0);
      });
      dt.appendChild(dg);
      home.appendChild(dt);
    }
  }
}

function setupDragReorder(grid,pics,onReorder){
  let dragSrcCard=null;
  grid.querySelectorAll('.pic-drag-handle').forEach(handle=>{
    const card=handle.closest('.pic-card');
    handle.addEventListener('dragstart',e=>{
      dragSrcCard=card;
      e.dataTransfer.effectAllowed='move';
      card.style.opacity='0.4';
    });
    handle.addEventListener('dragend',()=>{
      if(dragSrcCard)dragSrcCard.style.opacity='1';
      dragSrcCard=null;
    });
  });
  grid.querySelectorAll('.pic-card').forEach(card=>{
    card.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragSrcCard||dragSrcCard===card)return;
      const rect=card.getBoundingClientRect();
      const before=(e.clientX-rect.left)<rect.width/2;
      grid.insertBefore(dragSrcCard,before?card:card.nextSibling);
    });
    card.addEventListener('drop',async e=>{
      e.preventDefault();
      if(!dragSrcCard)return;
      const newOrderIds=[...grid.querySelectorAll('.pic-card')].map(c=>parseInt(c.dataset.picId));
      await Promise.all(newOrderIds.map((id,idx)=>DB.updatePicture(id,{sortOrder:idx})));
      showToast('Порядок сохранён');
      if(typeof onReorder==='function')await onReorder();
    });
  });
}

function escapeHtml(s){
  const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;
}

function calcPercent(userPixels,picPixels){
  if(!picPixels||!userPixels)return 0;
  let total=0;
  picPixels.forEach(row=>row.forEach(px=>{if(px.colorIdx>=0)total++}));
  if(!total)return 0;
  const done=Object.keys(userPixels).length;
  return Math.round(done/total*100);
}

function drawThumb(pic,progress,canvasId){
  const cvs=document.getElementById(canvasId);
  if(!cvs)return;
  const ctx=cvs.getContext('2d');
  const W=pic.cols,H=pic.rows;
  cvs.width=W;cvs.height=H;
  const img=ctx.createImageData(W,H);
  pic.pixels.forEach((row,r)=>row.forEach((px,c)=>{
    const i=(r*W+c)*4;
    if(px.colorIdx<0){
      img.data[i]=235;img.data[i+1]=235;img.data[i+2]=235;img.data[i+3]=255;
    }else{
      const col=pic.palette[px.colorIdx];
      const rgb=hexToRgb(col);
      const key=`${r},${c}`;
      if(progress&&progress.pixels[key]!==undefined){
        img.data[i]=rgb.r;img.data[i+1]=rgb.g;img.data[i+2]=rgb.b;img.data[i+3]=255;
      }else{
        const brightness=0.299*rgb.r+0.587*rgb.g+0.114*rgb.b;
        const v=brightness<128?60:215;
        img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255;
      }
    }
  }));
  ctx.putImageData(img,0,0);
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return{r,g,b};
}
function isLight(hex){
  const{r,g,b}=hexToRgb(hex);
  return(0.299*r+0.587*g+0.114*b)>140;
}

      <p style="font-size:13px;color:var(--text2);margin-bottom:20px">У вас: ${cu.coins} монет</p>
      <div style="display:flex;gap:8px">
        <button class="btn-orange" style="flex:1" onclick="purchaseAndOpen(${pic.id})">Да</button>
        <button class="btn-ghost" style="flex:1" onclick="closeModal()">Нет</button>
      </div>`);
    return;

async function purchaseAndOpen(picId){
  const cu=await refreshCurrentUser();
  const pics=await DB.getPictures();
  const pic=pics.find(p=>p.id===picId);
  if(!pic)return;
  if(cu.coins<pic.price){showToast('Недостаточно монет');closeModal();return}
  const newCoins=cu.coins-pic.price;
  await DB.updateUser(cu.login,{coins:newCoins});
  cu.coins=newCoins;window._cu=cu;updateCoinsDisplay();

  let progress=await DB.getProgress(cu.login,picId);
  if(!progress){
    progress=await DB.createProgress({userLogin:cu.login,pictureId:picId,pixels:{},full:false,purchased:true});
  }else{
    await DB.updateProgress(cu.login,picId,{purchased:true});
    progress.purchased=true;
  }
  closeModal();
  await startDraw(pic);
}

// ============================================================
// PIXEL VIEWPORT — общий движок: центр, зум, перемещение, рисование
// Используется в рисовании, просмотре готовой картины и редакторе M_fen
// ============================================================
window._themeStamp=window._themeStamp||0;

class PixelView{
  constructor(wrap,cvs,opts){
    this.wrap=wrap;this.cvs=cvs;this.ctx=cvs.getContext('2d');
    this.o=Object.assign({paint:false,touchAlwaysPaints:false,hintEl:null,render:null,paintAt:null,canPaintNear:null,touchRadius:null,onStrokeEnd:null},opts);
    this.cols=1;this.rows=1;this.scale=10;this.fitScale=10;this.ox=0;this.oy=0;
    this.w=0;this.h=0;this.dpr=1;this.userZoomed=false;
    this.ptrs=new Map();this.mode='none';this._raf=0;this._hintT=0;
    this.cellBg='#E4E4E7';this._stamp=-1;this._last=null;this._type='mouse';
    cvs.style.cursor=this.o.paint?'crosshair':'grab';
    this._bind();
    this.ro=new ResizeObserver(()=>this.resize());
    this.ro.observe(wrap);
  }
  destroy(){this.ro.disconnect();cancelAnimationFrame(this._raf);}

  setGrid(cols,rows){
    this.cols=Math.max(1,cols|0);this.rows=Math.max(1,rows|0);
    this.ptrs.clear();this.mode='none';this._last=null;
    this.resize(true);
  }

  resize(forceFit){
    const w=this.wrap.clientWidth,h=this.wrap.clientHeight;
    if(!w||!h)return;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const first=this.w===0,oldW=this.w,oldH=this.h;
    this.w=w;this.h=h;this.dpr=dpr;
    this.cvs.width=Math.round(w*dpr);this.cvs.height=Math.round(h*dpr);
    this._computeFit();
    if(first||forceFit===true||!this.userZoomed){
      this.fit();
    }else{
      const cx=(oldW/2-this.ox)/this.scale,cy=(oldH/2-this.oy)/this.scale;
      this.scale=Math.min(this._maxScale(),Math.max(this._minScale(),this.scale));
      this.ox=w/2-cx*this.scale;this.oy=h/2-cy*this.scale;
      this.clampPan();
    }
    this.draw();
  }

  _computeFit(){
    const pad=Math.min(24,Math.min(this.w,this.h)*0.04);
    const f=Math.min((this.w-2*pad)/this.cols,(this.h-2*pad)/this.rows);
    this.fitScale=Number.isFinite(f)&&f>0.2?f:0.2;
  }
  _minScale(){return Math.max(0.2,this.fitScale*0.4);}
  _maxScale(){return Math.max(64,this.fitScale*4);}

  // вписать картину в экран по центру (маленькие картинки — максимально крупно)
  fit(){
    this._computeFit();
    this.scale=this.fitScale;this.userZoomed=false;
    this.ox=(this.w-this.cols*this.scale)/2;
    this.oy=(this.h-this.rows*this.scale)/2;
    this.requestRender();
  }

  clampPan(){
    const gw=this.cols*this.scale,gh=this.rows*this.scale;
    const m=Math.min(60,Math.min(this.w,this.h)*0.15);
    if(gw<=this.w-2*m)this.ox=(this.w-gw)/2;
    else this.ox=Math.min(m,Math.max(this.w-gw-m,this.ox));
    if(gh<=this.h-2*m)this.oy=(this.h-gh)/2;
    else this.oy=Math.min(m,Math.max(this.h-gh-m,this.oy));
  }

  zoomAt(f,px,py){
    if(!Number.isFinite(f)||f<=0||!this.w)return;
    const ns=Math.min(this._maxScale(),Math.max(this._minScale(),this.scale*f));
    if(!Number.isFinite(ns)||ns===this.scale)return;
    const k=ns/this.scale;
    this.ox=px-(px-this.ox)*k;this.oy=py-(py-this.oy)*k;
    this.scale=ns;this.userZoomed=true;
    this.clampPan();this.showHint();this.requestRender();
  }

  showHint(){
    const el=this.o.hintEl;if(!el)return;
    const p=Math.round(this.scale/this.fitScale*100);
    if(!Number.isFinite(p))return;
    el.textContent=p+'%';el.style.opacity='1';
    clearTimeout(this._hintT);
    this._hintT=setTimeout(()=>{el.style.opacity='0';},900);
  }

  requestRender(){
    if(this._raf)return;
    this._raf=requestAnimationFrame(()=>{this._raf=0;this.draw();});
  }
  draw(){
    if(!this.w||!this.o.render)return;
    if(this._stamp!==window._themeStamp){
      this._stamp=window._themeStamp;
      this.cellBg=(getComputedStyle(document.documentElement).getPropertyValue('--bg3')||'').trim()||'#E4E4E7';
    }
    const ctx=this.ctx;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.clearRect(0,0,this.w,this.h);
    this.o.render(ctx,this);
  }

  // видимый диапазон клеток
  vis(){
    const s=this.scale;
    const c0=Math.max(0,Math.floor(-this.ox/s)),c1=Math.min(this.cols,Math.ceil((this.w-this.ox)/s));
    const r0=Math.max(0,Math.floor(-this.oy/s)),r1=Math.min(this.rows,Math.ceil((this.h-this.oy)/s));
    return{c0,c1,r0,r1,ok:c1>c0&&r1>r0};
  }
  // нарисовать видимую часть базовой картинки (1 пиксель = 1 клетка)
  blit(base,bg){
    const v=this.vis();if(!v.ok)return v;
    const s=this.scale,dx=this.ox+v.c0*s,dy=this.oy+v.r0*s,dw=(v.c1-v.c0)*s,dh=(v.r1-v.r0)*s;
    const ctx=this.ctx;
    if(bg){ctx.fillStyle=bg;ctx.fillRect(dx,dy,dw,dh);}
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(base,v.c0,v.r0,v.c1-v.c0,v.r1-v.r0,dx,dy,dw,dh);
    return v;
  }

  _local(x,y){const r=this.cvs.getBoundingClientRect();return{x:x-r.left,y:y-r.top};}
  _radius(type){return(type==='touch'&&this.o.touchRadius)?this.o.touchRadius(this.scale):0;}

  _bind(){
    const c=this.cvs;
    c.addEventListener('contextmenu',e=>e.preventDefault());
    c.addEventListener('wheel',e=>{
      e.preventDefault();
      let d=e.deltaY;
      if(e.deltaMode===1)d*=16;else if(e.deltaMode===2)d*=100;
      const f=Math.exp(-Math.max(-300,Math.min(300,d))*0.0015);
      const p=this._local(e.clientX,e.clientY);
      this.zoomAt(f,p.x,p.y);
    },{passive:false});
    c.addEventListener('pointerdown',e=>this._down(e));
    c.addEventListener('pointermove',e=>this._move(e));
    const up=e=>this._up(e);
    c.addEventListener('pointerup',up);
    c.addEventListener('pointercancel',up);
    c.addEventListener('lostpointercapture',up);
  }

  _down(e){
    if(!this.w)return;
    e.preventDefault();
    try{this.cvs.setPointerCapture(e.pointerId);}catch(_){}
    this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(this.ptrs.size===2){this._endStroke();this.mode='pinch';this._pinchStart();return;}
    if(this.ptrs.size>2)return;
    const touch=e.pointerType==='touch';
    this._type=touch?'touch':'mouse';
    if(!touch){
      if(e.button===0&&this.o.paint){this.mode='paint';this._strokeStart(e.clientX,e.clientY);}
      else{this.mode='pan';this.cvs.style.cursor='grabbing';}
    }else{
      const p=this._local(e.clientX,e.clientY);
      const can=this.o.paint&&(this.o.touchAlwaysPaints||(this.o.canPaintNear&&this.o.canPaintNear(p.x,p.y,this._radius('touch'),this)));
      if(can){this.mode='paint';this._strokeStart(e.clientX,e.clientY);}
      else this.mode='pan';
    }
  }
  _move(e){
    const p=this.ptrs.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    p.x=e.clientX;p.y=e.clientY;
    if(this.mode==='pinch'){if(this.ptrs.size>=2)this._pinchMove();}
    else if(this.mode==='pan'){this.ox+=dx;this.oy+=dy;this.clampPan();this.requestRender();}
    else if(this.mode==='paint'){
      const evs=e.getCoalescedEvents?e.getCoalescedEvents():null;
      if(evs&&evs.length>1)evs.forEach(ev=>this._strokeTo(ev.clientX,ev.clientY));
      else this._strokeTo(e.clientX,e.clientY);
    }
  }
  _up(e){
    if(!this.ptrs.has(e.pointerId))return;
    this.ptrs.delete(e.pointerId);
    this._endStroke();
    if(this.ptrs.size===0){this.mode='none';this.cvs.style.cursor=this.o.paint?'crosshair':'grab';}
    else if(this.mode==='pinch')this.mode='ignore';
  }

  _pts(){const a=[...this.ptrs.values()];return[a[0],a[1]];}
  _pinchStart(){
    const[a,b]=this._pts();
    this._pd=Math.hypot(a.x-b.x,a.y-b.y)||1;
    this._pm={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }
  _pinchMove(){
    const[a,b]=this._pts();
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1,m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    this.ox+=m.x-this._pm.x;this.oy+=m.y-this._pm.y;
    const r=this.cvs.getBoundingClientRect();
    this.zoomAt(d/this._pd,m.x-r.left,m.y-r.top);
    this.clampPan();this.requestRender();
    this._pd=d;this._pm=m;
  }

  _strokeStart(x,y){
    const p=this._local(x,y);this._last=p;
    if(this.o.paintAt)this.o.paintAt(p.x,p.y,this._radius(this._type),this);
  }
  _strokeTo(x,y){
    if(!this._last||!this.o.paintAt)return;
    const p=this._local(x,y),l=this._last,dx=p.x-l.x,dy=p.y-l.y,dist=Math.hypot(dx,dy);
    if(dist<0.5)return;
    const step=Math.max(2,Math.min(this.scale*0.5,8)),n=Math.max(1,Math.ceil(dist/step)),r=this._radius(this._type);
    for(let i=1;i<=n;i++)this.o.paintAt(l.x+dx*i/n,l.y+dy*i/n,r,this);
    this._last=p;
  }
  _endStroke(){
    if(!this._last)return;
    this._last=null;
    if(this.o.onStrokeEnd)this.o.onStrokeEnd(this);
  }
}

let _drawState={};
let _playView=null;
const C_UNP=0xFFE8E8E8,C_SEL=0xFFBFBFBF;

function hexToU32(hex){
  const{r,g,b}=hexToRgb(/^#[0-9a-fA-F]{6}$/.test(hex||'')?hex:'#999999');
  return((255<<24)|(b<<16)|(g<<8)|r)>>>0;
}

function getPlayView(){
  if(_playView)return _playView;
  _playView=new PixelView(document.getElementById('draw-canvas-wrap'),document.getElementById('draw-canvas'),{
    paint:true,
    hintEl:document.getElementById('zoom-hint'),
    render:renderPlay,
    paintAt:playPaintAt,
    canPaintNear:playCanPaintNear,
    // на телефоне палец толстый: на мелких клетках красим и соседние клетки выбранного цвета
    touchRadius:s=>s>=22?0:Math.min(8,Math.round(22-s)),
    onStrokeEnd:()=>{checkCompletion();}
  });
  return _playView;
}

async function startDraw(pic){
  const cu=await refreshCurrentUser();
  let progress=await DB.getProgress(cu.login,pic.id);
  if(!progress){
    progress=await DB.createProgress({userLogin:cu.login,pictureId:pic.id,pixels:{},full:false,purchased:pic.price===0});
  }
  progress.pixels=progress.pixels||{};
  const cols=pic.cols,rows=pic.rows,n=cols*rows;
  const ds={pic,progress,cols,rows,selectedColorIdx:null,colorPage:0,
    target:new Int16Array(n).fill(-1),done:new Uint8Array(n),
    pal32:pic.palette.map(hexToU32),colorCount:{},colorDone:{},remainingColors:[]};
  for(let r=0;r<rows;r++){
    const row=pic.pixels[r];if(!row)continue;
    for(let c=0;c<cols;c++){const px=row[c];if(px&&px.colorIdx>=0)ds.target[r*cols+c]=px.colorIdx;}
  }
  _drawState=ds;
  buildRemainingColors();
  ds.selectedColorIdx=ds.remainingColors.length?0:null;
  ds.baseCvs=document.createElement('canvas');ds.baseCvs.width=cols;ds.baseCvs.height=rows;
  ds.baseCtx=ds.baseCvs.getContext('2d');
  ds.baseImg=ds.baseCtx.createImageData(cols,rows);
  ds.base32=new Uint32Array(ds.baseImg.data.buffer);
  rebuildPlayBase();

  document.getElementById('draw-title').textContent=pic.name;
  document.getElementById('draw-coins-badge').innerHTML=`<span class="coin-icon"></span>+${pic.reward}`;
  renderColorMenu();

  document.getElementById('draw-screen').classList.add('open');
  getPlayView().setGrid(cols,rows);
}

function buildRemainingColors(){
  const ds=_drawState,cols=ds.cols,rows=ds.rows;
  const colorCount={},colorDone={};
  for(let i=0;i<ds.target.length;i++){const t=ds.target[i];if(t>=0)colorCount[t]=(colorCount[t]||0)+1;}
  Object.keys(colorCount).forEach(k=>{colorDone[k]=0;});
  for(const key in ds.progress.pixels){
    const p=key.split(',');const r=+p[0],c=+p[1];
    if(!(r>=0&&r<rows&&c>=0&&c<cols))continue;
    const i=r*cols+c,t=ds.target[i];
    if(t<0||ds.done[i])continue;
    ds.done[i]=1;colorDone[t]++;
  }
  ds.remainingColors=Object.keys(colorCount).filter(k=>colorDone[k]<colorCount[k]).map(Number).sort((a,b)=>a-b);
  ds.colorCount=colorCount;
  ds.colorDone=colorDone;
}

function getLabel(idx,pic){
  if(pic&&pic.labels&&pic.labels[idx]!==undefined&&pic.labels[idx]!=='')return pic.labels[idx];
  const labels='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  return labels[idx%labels.length];
}

// базовая картинка: 1 пиксель = 1 клетка (быстро, без перерисовки каждой клетки)
function rebuildPlayBase(){
  const ds=_drawState;if(!ds.base32)return;
  const sel=ds.remainingColors[ds.selectedColorIdx],t=ds.target,d=ds.done,b=ds.base32,pal=ds.pal32;
  for(let i=0;i<t.length;i++){
    const ti=t[i];
    b[i]=ti<0?0:(d[i]?pal[ti]:(ti===sel?C_SEL:C_UNP));
  }
  ds.baseDirty=true;
}

function renderPlay(ctx,v){
  const ds=_drawState;if(!ds.baseCvs)return;
  if(ds.baseDirty){ds.baseCtx.putImageData(ds.baseImg,0,0);ds.baseDirty=false;}
  const vis=v.blit(ds.baseCvs,v.cellBg);
  if(!vis.ok)return;
  const s=v.scale;
  if(s<8)return;
  const sel=ds.remainingColors[ds.selectedColorIdx],cols=ds.cols;
  const pn=new Path2D(),ps=new Path2D();
  const labels=s>=14?[]:null;
  for(let r=vis.r0;r<vis.r1;r++)for(let c=vis.c0;c<vis.c1;c++){
    const i=r*cols+c,t=ds.target[i];
    if(t<0||ds.done[i])continue;
    const x=v.ox+c*s,y=v.oy+r*s;
    (t===sel?ps:pn).rect(x+.5,y+.5,s-1,s-1);
    if(labels)labels.push(x+s/2,y+s/2,t,t===sel?1:0);
  }
  ctx.lineWidth=1;
  ctx.strokeStyle='#CCCCCC';ctx.stroke(pn);
  ctx.strokeStyle='#999999';ctx.stroke(ps);
  if(labels){
    ctx.font=`${Math.min(s*.5,16)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    for(let k=0;k<labels.length;k+=4){
      ctx.fillStyle=labels[k+3]?'#555555':'#888888';
      ctx.fillText(getLabel(labels[k+2],ds.pic),labels[k],labels[k+1]);
    }
  }
}

function playCellRange(px,py,r,v){
  const s=v.scale,ds=_drawState;
  return{
    c0:Math.max(0,Math.floor((px-r-v.ox)/s)),c1:Math.min(ds.cols-1,Math.floor((px+r-v.ox)/s)),
    r0:Math.max(0,Math.floor((py-r-v.oy)/s)),r1:Math.min(ds.rows-1,Math.floor((py+r-v.oy)/s))
  };
}

function playCanPaintNear(px,py,r,v){
  const ds=_drawState;if(!ds.pic)return false;
  const sel=ds.remainingColors[ds.selectedColorIdx];if(sel===undefined)return false;
  const g=playCellRange(px,py,r,v);
  for(let rr=g.r0;rr<=g.r1;rr++)for(let cc=g.c0;cc<=g.c1;cc++){
    const i=rr*ds.cols+cc;
    if(!ds.done[i]&&ds.target[i]===sel)return true;
  }
  return false;
}

function playPaintAt(px,py,r,v){
  const ds=_drawState;if(!ds.pic)return;
  const sel=ds.remainingColors[ds.selectedColorIdx];if(sel===undefined)return;
  const g=playCellRange(px,py,r,v);
  let changed=false;
  for(let rr=g.r0;rr<=g.r1;rr++)for(let cc=g.c0;cc<=g.c1;cc++){
    const i=rr*ds.cols+cc;
    if(ds.done[i]||ds.target[i]!==sel)continue;
    ds.done[i]=1;ds.base32[i]=ds.pal32[sel];
    ds.progress.pixels[rr+','+cc]=sel;
    ds.colorDone[sel]=(ds.colorDone[sel]||0)+1;
    changed=true;
  }
  if(!changed)return;
  ds.baseDirty=true;
  v.requestRender();
  schedulePixelSave();
  updateColorProgress(sel);
  if(ds.colorDone[sel]>=ds.colorCount[sel])finishColor(sel);
}

function finishColor(ci){
  const ds=_drawState;
  const ri=ds.remainingColors.indexOf(ci);if(ri<0)return;
  ds.remainingColors.splice(ri,1);
  if(ds.selectedColorIdx>=ds.remainingColors.length)ds.selectedColorIdx=ds.remainingColors.length?ds.remainingColors.length-1:null;
  ds.colorPage=ds.selectedColorIdx==null?0:Math.floor(ds.selectedColorIdx/8);
  rebuildPlayBase();
  renderColorMenu();
  if(_playView)_playView.requestRender();
}

function selectPlayColor(globalIdx){
  const ds=_drawState;
  ds.selectedColorIdx=globalIdx;
  rebuildPlayBase();
  renderColorMenu();
  if(_playView)_playView.requestRender();
}

let _saveTimer=null;
function schedulePixelSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    const ds=_drawState;
    if(!ds.pic)return;
    await DB.updateProgress(window._cu.login,ds.pic.id,{pixels:ds.progress.pixels});
  },1200);
}
async function forceSavePixels(){
  clearTimeout(_saveTimer);
  const ds=_drawState;
  if(!ds.pic||!window._cu)return;
  await DB.updateProgress(window._cu.login,ds.pic.id,{pixels:ds.progress.pixels});
}

function updateColorProgress(ci){
  const ds=_drawState;
  const pct=(ds.colorDone[ci]||0)/(ds.colorCount[ci]||1)*100;
  const bar=document.getElementById('cprog-'+ci);
  if(bar)bar.style.width=pct+'%';
}

async function checkCompletion(){
  const ds=_drawState;
  if(!ds.pic)return;
  if(ds.remainingColors.length>0)return;
  await forceSavePixels();
  const cu=await refreshCurrentUser();
  const already=await DB.getProgress(cu.login,ds.pic.id);
  if(already&&already.full)return;

  await DB.updateProgress(cu.login,ds.pic.id,{full:true,doneAt:Date.now()});
  const newCoins=cu.coins+ds.pic.reward;
  const newTotal=cu.totalCoins+ds.pic.reward;
  await DB.updateUser(cu.login,{coins:newCoins,totalCoins:newTotal});
  cu.coins=newCoins;cu.totalCoins=newTotal;window._cu=cu;updateCoinsDisplay();

  setTimeout(()=>{
    showModal(`<div class="modal-title">🎉 Картина завершена!</div>
      <p style="color:var(--text2);font-size:14px;margin-bottom:16px">Вы закрасили «${escapeHtml(ds.pic.name)}» и получили <b>${ds.pic.reward}</b> <span class="coin-icon" style="vertical-align:-2px"></span> монет!</p>
      <button class="btn-orange w100" onclick="closeModal();exitDraw()">Отлично!</button>`);
  },250);
}

function renderColorMenu(){
  const ds=_drawState;
  const PER_PAGE=8;
  const start=ds.colorPage*PER_PAGE;
  const slice=ds.remainingColors.slice(start,start+PER_PAGE);
  const total=Math.ceil(ds.remainingColors.length/PER_PAGE);

  document.getElementById('color-page-info').textContent=total>1?`${ds.colorPage+1}/${total}`:'';
  document.getElementById('color-prev').style.opacity=ds.colorPage===0?.3:1;
  document.getElementById('color-next').style.opacity=ds.colorPage>=total-1?.3:1;

  const row=document.getElementById('color-row');
  row.innerHTML='';
  slice.forEach(ci=>{
    const globalIdx=ds.remainingColors.indexOf(ci);
    const col=ds.pic.palette[ci];
    const pct=(ds.colorDone[ci]||0)/(ds.colorCount[ci]||1)*100;
    const bright=isLight(col);
    const item=document.createElement('div');
    item.className='color-item'+(globalIdx===ds.selectedColorIdx?' selected':'');
    item.style.background=col;
    item.innerHTML=`
      <div class="color-label" style="color:${bright?'#000':'#fff'}">${getLabel(ci,ds.pic)}</div>
      <div class="color-progress" id="cprog-${ci}" style="width:${pct}%"></div>`;
    item.onclick=()=>selectPlayColor(globalIdx);
    row.appendChild(item);
  });
  if(ds.remainingColors.length===0){
    row.innerHTML='<div style="color:var(--text2);font-size:14px;text-align:center;width:100%">Все цвета закрашены!</div>';
  }
}

function colPage(d){
  const ds=_drawState;
  const PER_PAGE=8;
  const total=Math.ceil(ds.remainingColors.length/PER_PAGE);
  ds.colorPage=Math.max(0,Math.min(total-1,ds.colorPage+d));
  renderColorMenu();
}

async function exitDraw(){
  await forceSavePixels();
  document.getElementById('draw-screen').classList.remove('open');
  _drawState={};
  await renderPictures();
}

async function renderFriends(){
  const cu=await refreshCurrentUser();
  const container=document.getElementById('friends-list');
  container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">Загрузка...</div>';

  const [friends,requests,allUsers]=await Promise.all([DB.getFriends(cu.login),DB.getFriendRequests(cu.login),DB.getUsers()]);
  const byLogin={};allUsers.forEach(u=>{byLogin[u.login]=u;});

  if(!friends.length&&!requests.length){
    container.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text2)">У вас пока нет друзей 😔<br>Найдите их через Поиск</div>';

  }
  container.innerHTML='';
  if(requests.length){
    const sec=document.createElement('div');

      if(!u)continue;
      const item=makeUserItem(u,`
        <button class="btn-orange" style="padding:5px 10px;font-size:12px" onclick="acceptFriend('${login}')">Принять</button>

    }

  }
  if(friends.length){
    const sec=document.createElement('div');
    sec.innerHTML='<div class="section-title">Друзья</div>';
    for(const login of friends){
      const u=byLogin[login];
      if(!u)continue;
      const item=makeUserItem(u,`<button class="btn-ghost" style="padding:5px 10px;font-size:12px" onclick="viewProfile('${login}')">Профиль</button>`);
      sec.appendChild(item);

    container.appendChild(sec);

function makeUserItem(u,actionsHtml=''){
  const wrap=document.createElement('div');
  const item=document.createElement('div');
  item.className='user-item';
  item.innerHTML=`
    <div class="u-avatar">${u.avatar?`<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:(u.nick||u.login)[0].toUpperCase()}</div>
    <div style="min-width:0"><div class="u-name">${escapeHtml(u.nick||u.login)}</div>${u.nick!==u.login?`<div class="u-sub">@${escapeHtml(u.login)}</div>`:''}</div>
    <div class="friend-actions">${actionsHtml}</div>`;
  wrap.appendChild(item);
  return wrap;
}

async function sendFriendRequest(toLogin){
  const cu=await refreshCurrentUser();
  const friends=await DB.getFriends(cu.login);
  if(friends.includes(toLogin)){showToast('Уже в друзьях');return}
  const ok=await DB.sendFriendRequest(cu.login,toLogin);
  if(ok)showToast('Заявка отправлена!');else showToast('Заявка уже отправлена');
  closeModal();
  if(getActiveNav()==='search')doSearch();
}

async function acceptFriend(login){
  const cu=await refreshCurrentUser();
  await DB.addFriendship(cu.login,login);
  await DB.removeFriendRequest(login,cu.login);
  await renderFriends();
}

async function rejectFriend(login){
  const cu=await refreshCurrentUser();
  await DB.removeFriendRequest(login,cu.login);
  await renderFriends();
}

async function doSearchNow(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  const res=document.getElementById('search-results');
  if(!q){res.innerHTML='';return}
  res.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2)">Поиск...</div>';
  const cu=window._cu;
  const [allUsers,friends,myReqsSent]=await Promise.all([DB.getUsers(),DB.getFriends(cu.login),getSentRequestsByMe(cu.login)]);
  const users=allUsers.filter(u=>u.login!==cu.login&&(u.login.toLowerCase().includes(q)||(u.nick||'').toLowerCase().includes(q)));
  res.innerHTML='';
  users.forEach(u=>{
    const isFriend=friends.includes(u.login);
    const sentReq=myReqsSent.includes(u.login);
    const item=makeUserItem(u,`
      <button class="btn-ghost" style="padding:5px 10px;font-size:12px" onclick="viewProfile('${u.login}')">Профиль</button>

      ${isFriend?'<span class="badge badge-green">Друг</span>':''}

    `);
    res.appendChild(item);
  });
  if(!users.length)res.innerHTML='<div style="text-align:center;color:var(--text2);padding:20px">Не найдено</div>';
}
async function getSentRequestsByMe(login){
  if(DEMO_MODE){
    return(LS.get('requests')||[]).filter(r=>r.fromLogin===login).map(r=>r.toLogin);
  }
  const {data,error}=await sb.from('friend_requests').select('to_login').eq('from_login',login);
  if(error)return[];
  return data.map(d=>d.to_login);
}

function drawFullColorThumb(pic,id){
  const cvs=document.getElementById(id);
  if(!cvs)return;
  cvs.width=pic.cols;cvs.height=pic.rows;
  const ctx=cvs.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const img=ctx.createImageData(pic.cols,pic.rows);
  pic.pixels.forEach((row,r)=>row.forEach((px,c)=>{
    const i=(r*pic.cols+c)*4;
    if(px.colorIdx<0){img.data[i]=235;img.data[i+1]=235;img.data[i+2]=235;img.data[i+3]=255;return;}
    const rgb=hexToRgb(pic.palette[px.colorIdx]);
    img.data[i]=rgb.r;img.data[i+1]=rgb.g;img.data[i+2]=rgb.b;img.data[i+3]=255;
  }));
  ctx.putImageData(img,0,0);
}

let _vcView=null,_vcState={};

function viewCompleted(pic){
  document.getElementById('view-completed-title').textContent=pic.name;
  const cols=pic.cols,rows=pic.rows;
  const cvs=document.createElement('canvas');cvs.width=cols;cvs.height=rows;
  const cx=cvs.getContext('2d');
  const img=cx.createImageData(cols,rows);
  const b=new Uint32Array(img.data.buffer);
  const pal=pic.palette.map(hexToU32);
  for(let r=0;r<rows;r++){
    const row=pic.pixels[r]||[];
    for(let c=0;c<cols;c++){
      const px=row[c];
      b[r*cols+c]=(px&&px.colorIdx>=0&&pal[px.colorIdx]!==undefined)?pal[px.colorIdx]:0xFFF0F0F0;
    }
  }
  cx.putImageData(img,0,0);
  _vcState={base:cvs};
  document.getElementById('view-completed-screen').classList.add('open');
  if(!_vcView){
    _vcView=new PixelView(document.getElementById('view-completed-wrap'),document.getElementById('view-completed-canvas'),{
      paint:false,
      hintEl:document.getElementById('view-completed-zoom-hint'),
      render:(ctx,v)=>{if(_vcState.base)v.blit(_vcState.base,null);}
    });
  }
  _vcView.setGrid(cols,rows);
}

function changeAvatar(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const img=new Image();
    img.onload=async()=>{
      const off=document.createElement('canvas');
      off.width=160;off.height=160;
      const ctx=off.getContext('2d');
      const side=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);
      const dataUrl=off.toDataURL('image/jpeg',0.85);
      const cu=await refreshCurrentUser();

  };

async function setAvatarFromPic(pic){
  // Рисуем картину пиксель-в-пиксель без сглаживания, затем увеличиваем "жёстким"
  // масштабированием (imageSmoothingEnabled=false), чтобы маленькие картинки
  // не блюрились и аккуратно влезали в круглый аватар.
  const off=document.createElement('canvas');
  off.width=pic.cols;off.height=pic.rows;
  const ctx=off.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const img=ctx.createImageData(pic.cols,pic.rows);
  pic.pixels.forEach((row,r)=>row.forEach((px,c)=>{
    const i=(r*pic.cols+c)*4;
    if(px.colorIdx<0){img.data[i]=235;img.data[i+1]=235;img.data[i+2]=235;img.data[i+3]=255;return;}
    const rgb=hexToRgb(pic.palette[px.colorIdx]);
    img.data[i]=rgb.r;img.data[i+1]=rgb.g;img.data[i+2]=rgb.b;img.data[i+3]=255;
  }));
  ctx.putImageData(img,0,0);
  const targetSize=160;
  const scale=Math.max(1,Math.ceil(targetSize/Math.max(pic.cols,pic.rows)));
  const big=document.createElement('canvas');
  big.width=pic.cols*scale;big.height=pic.rows*scale;
  const bigCtx=big.getContext('2d');
  bigCtx.imageSmoothingEnabled=false;
  bigCtx.drawImage(off,0,0,big.width,big.height);
  const cu=await refreshCurrentUser();
  const dataUrl=big.toDataURL('image/png');
  await DB.updateUser(cu.login,{avatar:dataUrl});
  cu.avatar=dataUrl;window._cu=cu;
  await viewProfile(cu.login);
  showToast('Аватар установлен!');
}

function resizeAdminCanvas(){

  const nr=Math.max(1,Math.min(256,parseInt(rEl.value)||1));
  cEl.value=nc;rEl.value=nr;
  // сохраняем уже нарисованное, а не стираем всё при смене размера
  const old=as.pixels;
  as.pixels=makeEmptyPixels(nc,nr);
  for(let r=0;r<Math.min(nr,old.length);r++)for(let c=0;c<Math.min(nc,old[r].length);c++)as.pixels[r][c]=old[r][c];
  as.cols=nc;as.rows=nr;
  renderAdminCanvas(true);
}

function clearAdminCanvas(){

const ADM_EMPTY=0xFF2E2A2A;

function rebuildAdminBase(){
  const as=_adminState,cols=as.cols,rows=as.rows;
  let b=as._base;
  if(!b||b.cols!==cols||b.rows!==rows){
    const cvs=document.createElement('canvas');cvs.width=cols;cvs.height=rows;
    const ctx=cvs.getContext('2d');
    const img=ctx.createImageData(cols,rows);
    b=as._base={cols,rows,cvs,ctx,img,u32:new Uint32Array(img.data.buffer),dirty:true};
  }
  const pal=as.palette.map(hexToU32);
  for(let r=0;r<rows;r++){
    const row=as.pixels[r];
    for(let c=0;c<cols;c++){
      const px=row&&row[c];
      const ci=px?px.colorIdx:-1;
      b.u32[r*cols+c]=(ci>=0&&pal[ci]!==undefined)?pal[ci]:ADM_EMPTY;
    }
  }
  b.dirty=true;
}

// refit=true — вписать картину в экран (старт, смена размера); false — просто перерисовать
function renderAdminCanvas(refit){
  const as=_adminState;
  if(!as._view)return;
  rebuildAdminBase();
  if(refit||as._view.cols!==as.cols||as._view.rows!==as.rows)as._view.setGrid(as.cols,as.rows);
  else as._view.requestRender();
}

function renderAdminView(ctx,v){
  const as=_adminState,b=as._base;if(!b)return;
  if(b.dirty){b.ctx.putImageData(b.img,0,0);b.dirty=false;}
  const vis=v.blit(b.cvs,null);
  if(!vis.ok)return;
  const s=v.scale;
  if(s<8)return;
  const p=new Path2D();
  for(let r=vis.r0;r<vis.r1;r++){
    const row=as.pixels[r];
    for(let c=vis.c0;c<vis.c1;c++){
      const px=row&&row[c];
      if(px&&px.colorIdx>=0)continue;
      p.rect(v.ox+c*s+.5,v.oy+r*s+.5,s-1,s-1);
    }
  }
  ctx.lineWidth=1;ctx.strokeStyle='#3A3A3E';ctx.stroke(p);
}

function adminPaintAt(px,py,rad,v){
  const as=_adminState,b=as._base;if(!b)return;
  const erase=as._tool==='erase';
  const sel=as._selectedColorIdx;
  if(!erase&&(sel===null||sel===undefined))return;
  const c=Math.floor((px-v.ox)/v.scale),r=Math.floor((py-v.oy)/v.scale);
  if(r<0||r>=as.rows||c<0||c>=as.cols)return;
  const cell=as.pixels[r]&&as.pixels[r][c];if(!cell)return;
  const nv=erase?-1:sel;
  if(cell.colorIdx===nv)return;
  cell.colorIdx=nv;
  b.u32[r*as.cols+c]=nv<0?ADM_EMPTY:hexToU32(as.palette[nv]);
  b.dirty=true;
  v.requestRender();
}

function createAdminView(){
  const as=_adminState;
  if(as._view){as._view.destroy();as._view=null;}
  as._view=new PixelView(document.getElementById('adm-canvas-wrap'),document.getElementById('adm-canvas'),{
    paint:true,touchAlwaysPaints:true,
    hintEl:document.getElementById('adm-zoom-hint'),
    render:renderAdminView,
    paintAt:adminPaintAt
  });
}

function destroyAdminView(){
  const as=_adminState;
  if(as._view){as._view.destroy();as._view=null;}
}

        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-orange" style="flex:1" onclick="confirmAutoColors()">Создать</button>
          <button class="btn-ghost" style="flex:1" onclick="closeModal()">Отмена</button>
        </div>`);
      input.value='';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function confirmAutoColors(){
  const as=_adminState;
  const img=as._pendingImg;
  if(!img)return;
  const autoCount=Math.max(1,Math.min(32,parseInt(document.getElementById('auto-color-count').value)||6));
  closeModal();

  const off=document.createElement('canvas');
  off.width=as.cols;off.height=as.rows;
  const ctx=off.getContext('2d');
  ctx.drawImage(img,0,0,as.cols,as.rows);
  const data=ctx.getImageData(0,0,as.cols,as.rows).data;

  // собираем непрозрачные пиксели
  const samples=[];
  for(let i=0;i<data.length;i+=4){
    if(data[i+3]>=128)samples.push([data[i],data[i+1],data[i+2]]);
  }
  const existingPalette=as.palette.map(hexToRgb).map(c=>[c.r,c.g,c.b]);
  const generated=kMeansColors(samples,autoCount);
  const fullPaletteRgb=[...existingPalette,...generated];
  const fullPaletteHex=fullPaletteRgb.map(rgbToHex);

  as.palette=fullPaletteHex;
  as.labels=fullPaletteHex.map((_,i)=>defaultLabel(i));

  as.pixels=Array.from({length:as.rows},(_,r)=>Array.from({length:as.cols},(_,c)=>{
    const i=(r*as.cols+c)*4;
    const a=data[i+3];
    if(a<128)return{colorIdx:-1};
    const [rr,gg,bb]=[data[i],data[i+1],data[i+2]];
    let best=-1,bestD=Infinity;
    fullPaletteRgb.forEach(([pr,pg,pb],pi)=>{
      const d=(rr-pr)**2+(gg-pg)**2+(bb-pb)**2;
      if(d<bestD){bestD=d;best=pi;}
    });
    return{colorIdx:best};
  }));

  as._selectedColorIdx=as.palette.length?0:null;
  as._pendingImg=null;
  renderAdminPalette();
  renderAdminCanvas(false);
  showToast('Цвета созданы из фото!');
}

function rgbToHex([r,g,b]){
  return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}

function kMeansColors(samples,k){
  if(samples.length===0)return Array.from({length:k},()=>[200,200,200]);
  if(samples.length<=k)return samples;
  // случайные начальные центры из выборки
  let centers=[];
  const step=Math.floor(samples.length/k);
  for(let i=0;i<k;i++)centers.push(samples[Math.min(i*step,samples.length-1)].slice());

  for(let iter=0;iter<8;iter++){
    const sums=centers.map(()=>[0,0,0,0]);
    for(const [r,g,b] of samples){
      let best=0,bestD=Infinity;
      for(let i=0;i<centers.length;i++){
        const [cr,cg,cb]=centers[i];
        const d=(r-cr)**2+(g-cg)**2+(b-cb)**2;
        if(d<bestD){bestD=d;best=i;}
      }
      sums[best][0]+=r;sums[best][1]+=g;sums[best][2]+=b;sums[best][3]++;
    }
    centers=centers.map((c,i)=>sums[i][3]>0?[sums[i][0]/sums[i][3],sums[i][1]/sums[i][3],sums[i][2]/sums[i][3]]:c);
  }
  return centers;
}

const MusicDB={
  async list(){
    if(DEMO_MODE)return LS.get('music')||[];
    const{data,error}=await sb.from('music').select('*').order('sort_order').order('id');
    if(error)throw error;
    return data.map(m=>({id:m.id,name:m.name,url:m.url,path:m.path,duration:Number(m.duration)||0}));
  },
  async add(file,name,duration){
    if(DEMO_MODE){
      const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file);});
      const list=LS.get('music')||[];
      list.push({id:Date.now(),name,url,duration});
      try{LS.set('music',list);}catch(e){throw new Error('файл слишком большой для демо-режима');}
      return;
    }
    const ext=((file.name.match(/\.([a-zA-Z0-9]+)$/)||[])[1]||'mp3').toLowerCase();
    const path=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
    const up=await sb.storage.from('music').upload(path,file,{contentType:file.type||'audio/mpeg',upsert:false});
    if(up.error)throw up.error;
    const url=sb.storage.from('music').getPublicUrl(path).data.publicUrl;
    const ins=await sb.from('music').insert({name,url,path,duration});
    if(ins.error){await sb.storage.from('music').remove([path]);throw ins.error;}
  },
  async remove(t){
    if(DEMO_MODE){LS.set('music',(LS.get('music')||[]).filter(x=>x.id!==t.id));return;}
    const{error}=await sb.from('music').delete().eq('id',t.id);
    if(error)throw error;
    if(t.path)await sb.storage.from('music').remove([t.path]);
  }
};

const MUSIC={list:[],cur:null,audio:new Audio(),open:false,seeking:false,seekTime:0,error:null};
MUSIC.audio.preload='metadata';

const ICON_PLAY='<svg viewBox="0 0 24 24" width="26" height="26"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" width="26" height="26"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1" fill="currentColor"/></svg>';
const ICON_PREV='<svg viewBox="0 0 24 24" width="26" height="26"><path d="M17 4.5v15l-13-7.5z" fill="currentColor"/></svg>';
const ICON_PLAY_SM='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';

function fmtTime(s){
  s=Number.isFinite(s)&&s>0?Math.floor(s):0;
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  const ss=String(sec).padStart(2,'0');
  return h>0?h+':'+String(m).padStart(2,'0')+':'+ss:m+':'+ss;
}

function musicIdx(){
  if(!MUSIC.cur)return-1;
  return MUSIC.list.findIndex(t=>t.id===MUSIC.cur.id);
}

async function loadMusic(){
  try{MUSIC.list=await MusicDB.list();MUSIC.error=null;}
  catch(e){console.error(e);MUSIC.error=e.message||'ошибка';MUSIC.list=[];}
  renderMusicList();updateMusicUI();
}

function toggleMusicPanel(force){
  const open=typeof force==='boolean'?force:!MUSIC.open;
  MUSIC.open=open;
  const p=document.getElementById('music-panel');
  p.classList.toggle('hidden',!open);
  if(open){
    document.getElementById('mp-add').classList.toggle('hidden',!(window._cu&&window._cu.isAdmin));
    updateMusicUI();
    loadMusic();
  }
}

function renderMusicList(){
  const el=document.getElementById('mp-list');if(!el)return;
  const admin=!!(window._cu&&window._cu.isAdmin);
  if(MUSIC.error){
    el.innerHTML='<div class="mp-empty">Музыка недоступна'+(admin?': '+escapeHtml(MUSIC.error):'')+'</div>';
    return;
  }
  if(!MUSIC.list.length){el.innerHTML='<div class="mp-empty">Пока нет музыки</div>';return;}
  el.innerHTML='';
  MUSIC.list.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='mp-row'+(MUSIC.cur&&MUSIC.cur.id===t.id?' active':'');
    row.innerHTML='<span class="mp-name">'+escapeHtml(t.name)+'</span><span class="mp-dur">'+fmtTime(t.duration)+'</span>'
      +'<button class="mp-rowbtn" title="Проиграть">'+ICON_PLAY_SM+'</button>'
      +(admin?'<button class="mp-del" title="Удалить">✕</button>':'');
    row.querySelector('.mp-rowbtn').onclick=()=>musicPlayTrack(i);
    const del=row.querySelector('.mp-del');
    if(del)del.onclick=()=>deleteMusicTrack(i);
    el.appendChild(row);
  });
}

function updateMusicUI(){
  const $=id=>document.getElementById(id);
  if(!$('mp-title'))return;
  const a=MUSIC.audio,t=MUSIC.cur;
  $('mp-title').textContent=t?t.name:'Музыка не выбрана';
  const playing=!!t&&!a.paused;
  $('mp-play').innerHTML=playing?ICON_PAUSE:ICON_PLAY;
  $('music-fab').classList.toggle('playing',playing);
  const dur=(Number.isFinite(a.duration)&&a.duration>0)?a.duration:(t?t.duration:0);
  const cur=MUSIC.seeking?MUSIC.seekTime:(a.currentTime||0);
  $('mp-cur').textContent=fmtTime(cur);
  $('mp-total').textContent=fmtTime(dur);
  const p=dur>0?Math.max(0,Math.min(1,cur/dur)):0;
  $('mp-fill').style.width=(p*100)+'%';
  $('mp-knob').style.left=(p*100)+'%';
}

function musicErr(e){
  console.error(e);
  if(e&&e.name==='AbortError')return;
  showToast('Не удалось воспроизвести');
}

function musicPlayTrack(i){
  const t=MUSIC.list[i];if(!t)return;
  const a=MUSIC.audio;
  if(MUSIC.cur&&MUSIC.cur.id===t.id){
    if(a.paused)a.play().catch(musicErr);else a.pause();
    return;
  }
  MUSIC.cur=t;
  a.src=t.url;
  a.play().catch(musicErr);
  renderMusicList();updateMusicUI();
}

function musicToggle(){
  const a=MUSIC.audio;
  if(!MUSIC.cur){
    if(!MUSIC.list.length){showToast('Пока нет музыки');return;}
    musicPlayTrack(0);return;
  }
  if(a.paused)a.play().catch(musicErr);else a.pause();
}

function musicStep(dir,auto){
  const n=MUSIC.list.length;if(!n)return;
  const idx=musicIdx();
  if(auto&&n===1){MUSIC.audio.currentTime=0;MUSIC.audio.play().catch(musicErr);return;}
  const next=idx<0?(dir>0?0:n-1):(idx+dir+n)%n;
  MUSIC.cur=null;            // чтобы musicPlayTrack запустил именно новый трек
  musicPlayTrack(next);
}
function musicNext(auto){musicStep(1,auto===true);}
function musicPrev(){musicStep(-1,false);}

async function deleteMusicTrack(i){
  const t=MUSIC.list[i];if(!t)return;
  if(!confirm('Удалить «'+t.name+'»?'))return;
  try{await MusicDB.remove(t);}
  catch(e){console.error(e);showToast('Ошибка: '+(e.message||'не удалось удалить'));return;}
  if(MUSIC.cur&&MUSIC.cur.id===t.id){MUSIC.audio.pause();MUSIC.audio.removeAttribute('src');MUSIC.cur=null;}
  await loadMusic();
}

function audioDuration(file){
  return new Promise((res,rej)=>{
    const a=new Audio(),url=URL.createObjectURL(file);
    const done=(v,err)=>{URL.revokeObjectURL(url);err?rej(err):res(v);};
    a.preload='metadata';
    a.onloadedmetadata=()=>done(Number.isFinite(a.duration)?a.duration:0);
    a.onerror=()=>done(0,new Error('не удалось прочитать файл'));
    setTimeout(()=>done(0,new Error('timeout')),8000);
    a.src=url;
  });
}

function openMusicAdd(){
  showModal(`
    <div class="modal-title">Добавить музыку</div>
    <div class="field"><label>Файл</label><input type="file" id="ma-file" accept="audio/*"></div>
    <div class="field"><label>Название</label><input id="ma-name" placeholder="Название музыки"></div>
    <p id="ma-info" class="err" style="color:var(--text2)"></p>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn-orange" id="ma-btn" style="flex:1" onclick="submitMusicAdd()">Добавить</button>
      <button class="btn-ghost" style="flex:1" onclick="closeModal()">Отмена</button>
    </div>`);
  document.getElementById('ma-file').onchange=async function(){
    const f=this.files[0];if(!f)return;
    const nm=document.getElementById('ma-name');
    if(!nm.value.trim())nm.value=f.name.replace(/\.[^.]+$/,'');
    const info=document.getElementById('ma-info');
    info.style.color='var(--text2)';info.textContent='Считаю длительность...';

async function submitMusicAdd(){
  const f=document.getElementById('ma-file').files[0];
  const name=document.getElementById('ma-name').value.trim();
  const info=document.getElementById('ma-info'),btn=document.getElementById('ma-btn');
  info.style.color='#F87171';
  if(!f){info.textContent='Выберите файл';return}
  if(!name){info.textContent='Введите название';return}
  btn.disabled=true;btn.textContent='Загрузка...';
  try{
    const dur=await audioDuration(f).catch(()=>0);
    await MusicDB.add(f,name,Math.round(dur*10)/10);
  }catch(e){
    console.error(e);
    info.textContent='Ошибка: '+(e.message||'не удалось загрузить');
    btn.disabled=false;btn.textContent='Добавить';
    return;
  }
  closeModal();
  showToast('Музыка добавлена');
  await loadMusic();
}

function stopMusic(){
  const a=MUSIC.audio;
  a.pause();a.removeAttribute('src');
  MUSIC.cur=null;
  toggleMusicPanel(false);
  updateMusicUI();
}

function setupMusic(){
  const a=MUSIC.audio;
  ['timeupdate','durationchange','loadedmetadata','play','pause'].forEach(ev=>a.addEventListener(ev,()=>{if(!MUSIC.seeking)updateMusicUI();}));
  a.addEventListener('ended',()=>musicNext(true));
  a.addEventListener('error',()=>{if(a.getAttribute('src'))showToast('Не удалось воспроизвести');});

  const bar=document.getElementById('mp-bar');
  const frac=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));};
  bar.addEventListener('pointerdown',e=>{
    const dur=Number.isFinite(a.duration)?a.duration:0;
    if(!MUSIC.cur||!dur)return;
    MUSIC.seeking=true;MUSIC.seekTime=frac(e)*dur;
    try{bar.setPointerCapture(e.pointerId);}catch(_){}
    updateMusicUI();
  });
  bar.addEventListener('pointermove',e=>{
    if(!MUSIC.seeking)return;
    MUSIC.seekTime=frac(e)*a.duration;updateMusicUI();
  });
  bar.addEventListener('pointerup',()=>{
    if(!MUSIC.seeking)return;
    MUSIC.seeking=false;a.currentTime=MUSIC.seekTime;updateMusicUI();
  });
  bar.addEventListener('pointercancel',()=>{MUSIC.seeking=false;updateMusicUI();});

  // клик вне меню закрывает его
  document.addEventListener('pointerdown',e=>{
    if(!MUSIC.open)return;
    if(e.target.closest('#music-panel')||e.target.closest('#music-fab')||e.target.closest('#modal-overlay'))return;
    toggleMusicPanel(false);
  });
}

function setupPullToRefresh(){
  const scrollEl=document.getElementById('view-home');
  const indicator=document.getElementById('ptr-indicator');
  const spinner=document.getElementById('ptr-spinner');
  const label=document.getElementById('ptr-label');
  const THRESHOLD=70;
  let startY=0,pulling=false,refreshing=false;

  scrollEl.addEventListener('touchstart',e=>{
    if(scrollEl.scrollTop<=0&&getActiveNav()==='home'){
      startY=e.touches[0].clientY;
      pulling=true;
    }else{
      pulling=false;
    }
  },{passive:true});

  scrollEl.addEventListener('touchmove',e=>{
    if(!pulling||refreshing)return;
    const diff=e.touches[0].clientY-startY;
    if(diff>0&&scrollEl.scrollTop<=0){
      const height=Math.min(diff*0.5,90);
      indicator.style.height=height+'px';
      spinner.style.transform=`rotate(${height*4}deg)`;
      label.textContent=height>=THRESHOLD?'Отпустите, чтобы обновить':'Потяните, чтобы обновить';
    }
  },{passive:true});

  scrollEl.addEventListener('touchend',async()=>{
    if(!pulling||refreshing)return;
    const height=parseInt(indicator.style.height)||0;
    pulling=false;
    if(height>=THRESHOLD){
      refreshing=true;
      indicator.style.height='50px';
      label.textContent='Обновление...';
      spinner.style.animation='spin .6s linear infinite';
      await renderHome();
      spinner.style.animation='';
      indicator.style.height='0px';
      refreshing=false;
    }else{
      indicator.style.height='0px';
    }
  });
}

async function init(){
  initSupabase();
  setupCatsDrag();

  document.getElementById('loading-overlay').style.display='none';

  }
}
